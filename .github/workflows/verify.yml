name: HTML・CSSとJSゼロの検証
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Public repository: Git and Python only, no Node-based checkout action.
      - name: 対象コミットを取得する
        env:
          REPOSITORY: ${{ github.repository }}
          REVISION: ${{ github.sha }}
        run: |
          git init .
          git remote add origin "https://github.com/${REPOSITORY}.git"
          git fetch --depth=1 origin "$REVISION"
          git checkout --detach FETCH_HEAD
      - name: 検証環境を記録する
        run: python3 --version
      - name: 開発ソースのJSゼロを検査する
        run: python3 -m tools.source_audit
      - name: HTMLとCSSを生成する
        run: python3 -m tools.build
      - name: 監査・配布・JSゼロをテストする
        run: python3 -m unittest discover -s tests -v
      - name: 配布HTMLを監査する
        run: python3 -m tools.audit
      - name: 現在のソースから配布物を生成する
        run: python3 -m tools.package
      - name: 生成済みファイルの鮮度を検査する
        run: python3 -m tools.build --check
      - name: 配布ZIPと外部manifestを照合する
        run: python3 -m tools.verify dist/css-synthesizer-v0.1.zip --manifest dist/css-synthesizer-v0.1.manifest.json
      - name: 前回の保存座標を独立数式で再照合する
        run: python3 -m tools.coordinates --batch qa/evidence/batch40/index.json
      - name: 今回の保存座標を独立数式で再照合する
        run: python3 -m tools.coordinates --batch qa/evidence/batch60/index.json
      - name: 保存した接線の方向を独立微分で再照合する
        run: |
          for snapshot_path in qa/evidence/batch60/tangent-*.json; do
            python3 -m tools.tangents "$snapshot_path" || exit 1
          done
