<dialog id="operation-dialog" class="operation-dialog" aria-labelledby="operation-dialog-title">
  <h2 id="operation-dialog-title">形を探す3つの操作</h2>
  <ol>
    <li>形を選びます。キーボードではラジオボタンを選び、矢印キーで切り替えます。</li>
    <li>反復・位相・振幅の帯を横に動かします。帯の左右キーは細かい調整、両端の矢印は大きな移動です。</li>
    <li>気に入った形で時間を「停止」にします。止めたまま調整でき、「再生」で続きから動きます。</li>
  </ol>
  <p>ガイドを開いても時間の設定は変わりません。詳しい数式と対応環境は、画面下の「使い方と仕組み」で確認できます。</p>
  <button type="button" commandfor="operation-dialog" command="request-close" autofocus>ガイドを閉じる</button>
</dialog>
