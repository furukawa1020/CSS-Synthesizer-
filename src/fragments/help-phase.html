<button type="button" class="parameter-help-trigger" popovertarget="parameter-phase-detail" aria-label="位相の説明"><span aria-hidden="true">?</span></button>
<div id="parameter-phase-detail" class="parameter-help" popover="auto" aria-labelledby="parameter-phase-title">
  <h3 id="parameter-phase-title">位相は角度のずれ</h3>
  <p>範囲は0〜360°、表示と描画は同じ1°刻みです。選んだモデルの式に角度のずれを与えます。波の横ずれ、全体の回転など、見え方はモデルで異なります。</p>
  <p>0°と360°は数式上同じ位相です。自動で進む時間を停止しても、位相の帯は調整できます。</p>
  <button type="button" popovertarget="parameter-phase-detail" popovertargetaction="hide">説明を閉じる</button>
</div>
