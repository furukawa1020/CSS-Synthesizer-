<button type="button" class="parameter-help-trigger" popovertarget="parameter-k-detail" aria-label="反復の説明"><span aria-hidden="true">?</span></button>
<div id="parameter-k-detail" class="parameter-help" popover="auto" aria-labelledby="parameter-k-title">
  <h3 id="parameter-k-title">反復は形の構造</h3>
  <p>範囲は1.00〜8.00、表示と描画は同じ0.01刻みです。反復を増やすと、折り返し・波・巻き方などモデルに対応する形の構造が変わります。自動再生の速さは変わりません。</p>
  <p>帯を横に動かすか左右キーで調整します。両端の矢印は一定の数値刻みではなく、大きく送る操作です。</p>
  <button type="button" popovertarget="parameter-k-detail" popovertargetaction="hide">説明を閉じる</button>
</div>
