<fieldset class="view-option"><legend>点の形</legend><div class="view-choices"><label><input id="shape-round" type="radio" name="point-shape" value="round" checked><span>丸</span></label><label><input id="shape-square" type="radio" name="point-shape" value="square"><span>四角</span></label><label><input id="shape-diamond" type="radio" name="point-shape" value="diamond"><span>菱形</span></label><label class="tangent-choice"><input id="shape-arrow" type="radio" name="point-shape" value="arrow"><span>接線の矢印</span></label></div><p class="view-option-note">矢印は点の並びが進む接線方向で、時間の動く方向ではありません。微分ベクトルがほぼ0（ノルム0.000001未満）なら矢印を隠します。フェルマー始点は片側の極限方向です。矢印の塗りは通常の点の約3倍の長さになります。</p><p class="view-option-note tangent-unavailable">このブラウザではatan2()とhypot()が必要な接線矢印を利用できません。</p></fieldset>
