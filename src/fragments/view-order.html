<fieldset class="view-option"><legend>点の色</legend><div class="view-choices"><label><input id="color-uniform" type="radio" name="point-color" value="uniform" checked><span>単色</span></label><label><input id="color-order" type="radio" name="point-color" value="order"><span>描画順</span></label><label class="quadrant-choice"><input id="color-quadrant" type="radio" name="point-color" value="quadrant"><span>座標の符号</span></label></div><p class="view-option-note">色の変化は点の並び u=0 → 1 を表します。時間の経過や速さではありません。強制カラーと印刷では単色です。</p></fieldset>
<p class="view-option-note quadrant-note">符号の色は加工後・反転/回転前。x≤0,y≤0：橙 ／ x&gt;0,y≤0：緑 ／ x≤0,y&gt;0：青 ／ x&gt;0,y&gt;0：紫。軸上の0は非正側です。</p>
