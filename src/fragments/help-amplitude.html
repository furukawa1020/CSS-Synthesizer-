<button type="button" class="parameter-help-trigger" popovertarget="parameter-amplitude-detail" aria-label="振幅の説明"><span aria-hidden="true">?</span></button>
<div id="parameter-amplitude-detail" class="parameter-help" popover="auto" aria-labelledby="parameter-amplitude-title">
  <h3 id="parameter-amplitude-title">振幅は形の広がり</h3>
  <p>範囲は25〜100%、表示と描画は同じ1%刻みです。波形では高さだけ、ほかのモデルでは縦横の大きさを変えます。座標は縦横で同じ倍率を保ちます。</p>
  <p>見た目の点の太さとは別の値です。大きさを変えても、描画する点数は変わりません。</p>
  <button type="button" popovertarget="parameter-amplitude-detail" popovertargetaction="hide">説明を閉じる</button>
</div>
