<div class="view-settings">
  <button type="button" class="view-settings-open" popovertarget="view-panel">比較の表示設定</button>
  <section id="view-panel" class="view-panel" popover="auto" aria-labelledby="view-title">
    <div class="view-panel-header"><h2 id="view-title">比較の表示設定</h2><button type="button" class="view-settings-close" popovertarget="view-panel" popovertargetaction="hide">閉じる</button></div>
    <p class="view-description">選択したすべての図に同じ表示設定を適用します。数式の入力と時計は変えません。</p>
    <fieldset class="view-option"><legend>図中の説明</legend><label><input id="view-labels" type="checkbox" checked><span>形の名前・点数・座標の説明を表示</span></label></fieldset>
    @@FRAGMENT:view-grid@@
    @@FRAGMENT:view-points@@
    @@FRAGMENT:view-shape@@
    @@FRAGMENT:view-palette@@
    @@FRAGMENT:view-order@@
    @@FRAGMENT:view-range@@
    @@FRAGMENT:view-endpoints@@
  </section>
</div>
